version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /M3UProxy
      - /M3UProxyApp
      - /M3UProxy.Tests
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
